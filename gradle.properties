android.useAndroidX=true
# Avoid the build JDK's C2 optimizer crash observed on this Windows host.
# This setting affects Gradle only, not the Android application's runtime.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:TieredStopAtLevel=1
org.gradle.workers.max=1
org.gradle.vfs.watch=false
kotlin.compiler.execution.strategy=in-process
